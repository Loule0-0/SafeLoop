[project]
name = "safeloop"
version = "0.1.0"
description = "SafeLoop safety wrapper for robotic manipulation policies."
requires-python = ">=3.10,<3.11"
dependencies = [
    "accelerate==1.8.1",
    "huggingface-hub>=0.30,<1.0",
    "imageio==2.37.0",
    "imageio-ffmpeg==0.6.0",
    "numpy==1.26.4",
    "peft==0.15.2",
    "pillow==11.2.1",
    "qwen-vl-utils==0.0.14",
    "torch==2.7.1",
    "transformers==4.53.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]

[tool.setuptools.packages.find]
include = ["safety_guard*"]
